org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.1.2
minecraft_version_range=[26.1,27)
neo_version=26.1.2.116
neo_version_range=[26.1.2.71,26.2)
loader_version_range=[4,)

ae2_version=26.1.10-beta
ae2_version_range=[26.1,27)

# pattern provider integrations; Advanced AE needs its own mixins, the rest inherit AE2's provider logic and are runtime fixtures.
advanced_ae_file=8603081
advanced_ae_version_range=[26.1,)
ae2addonlib_file=8235116
geckolib_file=8327201
extendedae_file=8598964
glodium_file=8196173
# nep's own requirement, for -Pwith_nep boots only.
gmrecipes_file=9064322

mod_id=ae2importcard
mod_name=AE2 Import Card
mod_license=MIT
mod_version=0.1.0
mod_group_id=dev.rylex.ae2importcard
mod_authors=Rylex
mod_description=An upgrade card that lets AE2 Pattern Providers collect the results of the jobs they send out.

curseforge_required_dependencies=applied-energistics-2
curseforge_optional_dependencies=advancedae,ex-pattern-provider

# set once the CurseForge project exists; blank disables the upload step in release-mod.ps1
curseforge_project_id=1744793
# optional; defaults to <minecraft_version>,NeoForge,Java 21
curseforge_game_versions=26.1.2,NeoForge,Java 25
