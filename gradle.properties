geckolib_file=8350073
extendedae_file=8511901
glodium_file=5821676
# Expanded AE @Overwrites PatternProviderLogic.pushPattern, which the card must still inject into.
expandedae_file=6910849
megacells_file=7952621
# Draconic fusion: the autocrafter adds the provider, Draconic Evolution the fusion core it feeds.
ae2_draconic_fusion_autocrafter_file=8595208
draconic_evolution_file=7584459
brandonscore_file=7130990
codechickenlib_file=8491811
# nep's own requirement, for -Pwith_nep boots only.
gmrecipes_file=9064319
# Expanded AE needs ae2wtlib at runtime.
ae2wtlib_file=8450398
architectury_file=8492726
tool_kit_file=8216546

mod_id=ae2importcard
mod_name=AE2 Import Card
mod_license=MIT
mod_version=0.1.0
mod_group_id=dev.rylex.ae2importcard
mod_authors=Rylex
mod_description=An upgrade card that lets AE2 Pattern Providers collect the results of the jobs they send out.

curseforge_required_dependencies=applied-energistics-2
curseforge_optional_dependencies=advancedae,ex-pattern-provider,expanded-ae,mega-cells

